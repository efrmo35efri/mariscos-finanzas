<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mariscos · Finanzas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%230e7c9b'/><text x='50' y='68' font-size='58' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'>M</text></svg>">
<style>
:root{--bg:#eaf6f8;--card:#fff;--ink:#0f2a3d;--mut:#5b7586;--line:#d5e7ec;--pri:#0e7c9b;--ok:#16a34a;--bad:#e11d48;--coral:#ff6b4a;--sun:#ffc83d;--navy:#0b2e45;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:17px}
button{font:inherit;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;background:#fff;color:var(--ink);min-height:48px;cursor:pointer;box-shadow:0 2px 6px #0b2e4518}
button.pri{background:linear-gradient(135deg,#0e9bbd,#0a5f78);color:#fff;border:0}
button.bad{background:linear-gradient(135deg,#fb7185,#e11d48);color:#fff;border:0}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--ink)}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:15px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:linear-gradient(90deg,#0b2e45,#0e7c9b 70%,#ff6b4a);color:#fff;position:sticky;top:0;z-index:5}
.top b{margin-right:auto;font-size:19px}
.top button{background:#ffffff26;color:#fff;border:0;box-shadow:none;min-height:42px;padding:8px 14px}
.top button.on{background:var(--sun);color:var(--navy);font-weight:700}
main{max-width:980px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 4px 14px #0b2e4512;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.wrap{flex-wrap:wrap}
.mut{color:var(--mut)}.big{font-size:26px;font-weight:700;color:var(--navy)}.right{text-align:right}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stat .card{margin:0}
.ok{color:var(--ok)}.neg{color:var(--bad)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th.r,td.r{text-align:right}tr.hoy td{background:#fff7d6}
.login{max-width:380px;margin:12vh auto;padding:0 14px}
.marca{text-align:center}.marca h1{margin:6px 0;color:var(--navy)}.marca h1 span{color:var(--coral)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;z-index:50;max-width:92vw}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.modal>div{background:#fff;border-radius:20px;padding:18px;max-width:480px;width:100%;max-height:94vh;overflow:auto}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;background:#e0f2fe;color:#075985}
.chip.sueldo{background:#fef3c7;color:#92400e}.chip.otro{background:#ede9fe;color:#5b21b6}
.hide{display:none}
</style></head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== CONFIGURACIÓN (la llave anon/public NO es secreta; la protección está en RLS) ======
const SUPABASE_URL = 'https://bvkyfhoewtexuhsqjtwy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_wj62vjdUDrTgcGvvkrllaw_Zpp9QB28';
const CUENTA = 'finanzas@mariscoselprimo.com';   // cuenta unica; en la pantalla solo se pide la contrasena
// ==========================================================================================
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + (Math.round((+n || 0) * 100) / 100).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoy = () => ymd(new Date());
const DIAS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const lunes = (f) => { const [y, m, d] = f.split('-').map(Number); const dt = new Date(y, m - 1, d); dt.setDate(dt.getDate() - ((dt.getDay() + 6) % 7)); return dt; };
function toast(m, t = '') { const d = document.createElement('div'); d.className = 'toast ' + t; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), t === 'bad' ? 5000 : 2200); }
async function run(fn) { try { return await fn(); } catch (e) { toast(e.message || String(e), 'bad'); } }
const ok = r => { if (r.error) throw new Error(r.error.message); return r.data; };

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let PERFIL = null, TAB = 'semana', PRE = null;
const app = $('#app');

function login(msg = '') {
  app.innerHTML = `<div class="login"><div class="marca"><div style="font-size:54px">🦐🐟🦀</div><h1>Mariscos <span>El Primo</span></h1><p class="mut">Finanzas</p></div>
    <div class="card"><label>Contraseña</label><input id="pw" type="password" autocomplete="current-password" autofocus>
    <p class="neg" id="er">${esc(msg)}</p><button class="pri" style="width:100%" id="go">Entrar</button></div></div>`;
  $('#go').onclick = async () => {
    const r = await sb.auth.signInWithPassword({ email: CUENTA, password: $('#pw').value });
    if (r.error) return $('#er').textContent = 'Contraseña incorrecta';
    iniciar();
  };
  $('#pw').addEventListener('keydown', e => e.key === 'Enter' && $('#go').click());
}
async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return login();
  const r = await sb.from('perfiles').select('nombre,rol').eq('user_id', session.user.id).maybeSingle();
  if (!r.data || r.data.rol === 'sync') { await sb.auth.signOut(); return login('Esta cuenta no tiene acceso a Finanzas'); }
  PERFIL = r.data; TAB = PERFIL.rol === 'admin' ? 'semana' : 'salidas'; pintar();
}
function marco() {
  const t = PERFIL.rol === 'admin' ? [['semana', 'Resumen'], ['reportes', 'Reportes'], ['salidas', 'Salidas'], ['proveedores', 'Proveedores'], ['personal', 'Personal']] : [['salidas', 'Salidas']];
  app.innerHTML = `<div class="top"><b>🦐 Mariscos · ${esc(PERFIL.nombre)}</b>${t.map(([k, n]) => `<button class="${TAB === k ? 'on' : ''}" data-t="${k}">${n}</button>`).join('')}<button id="sal">Salir</button></div><main id="m"></main>`;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { TAB = b.dataset.t; pintar(); });
  $('#sal').onclick = async () => { await sb.auth.signOut(); login(); };
}
function pintar() { marco(); run(() => ({ semana, reportes, salidas, proveedores, personal })[TAB]()); }

// ---------- REPORTE ----------
let REP = { per: 'semana', ref: hoy(), d1: hoy(), d2: hoy(), tipo: 'todo', prov: '', todas: false };
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fd = f => { const [, m, d] = f.split('-'); return `${+d} ${MESES[m - 1]}`; };
const fdia = f => { const [y, m, d] = f.split('-').map(Number); return DIAS[(new Date(y, m - 1, d).getDay() + 6) % 7] + ' ' + fd(f); };
function rangoRep() {
  const [y, m] = REP.ref.split('-').map(Number);
  if (REP.per === 'dia') return [REP.ref, REP.ref];
  if (REP.per === 'semana') { const l = lunes(REP.ref), f = new Date(l); f.setDate(l.getDate() + 6); return [ymd(l), ymd(f)]; }
  if (REP.per === 'mes') return [ymd(new Date(y, m - 1, 1)), ymd(new Date(y, m, 0))];
  return [REP.d1, REP.d2];
}
function moverRep(n) {
  const [y, m, d] = REP.ref.split('-').map(Number), dt = new Date(y, m - 1, d);
  if (REP.per === 'dia') dt.setDate(dt.getDate() + n); else if (REP.per === 'semana') dt.setDate(dt.getDate() + 7 * n); else dt.setMonth(dt.getMonth() + n, 1);
  REP.ref = ymd(dt);
}

async function semana() {
  const [desde, hasta] = rangoRep();
  if (desde > hasta) throw new Error('La fecha inicial es mayor que la final');
  const [cortes, egr, emps] = await Promise.all([
    sb.from('cortes').select('fecha,ventas_netas,propinas,efectivo,tarjeta,transferencia,otro').gte('fecha', desde).lte('fecha', hasta).then(ok),
    sb.from('egresos').select('*,proveedores(nombre),empleados(nombre)').gte('fecha', desde).lte('fecha', hasta).eq('cancelado', false).order('fecha', { ascending: false }).order('id', { ascending: false }).then(ok),
    REP.per === 'semana' ? sb.from('empleados').select('*').eq('activo', true).gt('sueldo_semanal', 0).order('nombre').then(ok) : []]);

  const dias = {}, D = f => dias[f] || (dias[f] = { f, ventas: 0, efectivo: 0, tarjeta: 0, transferencia: 0, otro: 0, sal: 0, eg: [] });
  let propinas = 0;
  for (const c of cortes) { const d = D(c.fecha); d.ventas += +c.ventas_netas; d.efectivo += +c.efectivo; d.tarjeta += +c.tarjeta; d.transferencia += +c.transferencia; d.otro += +c.otro; propinas += +c.propinas; }
  for (const e of egr) { const d = D(e.fecha); d.sal += +e.monto; d.eg.push(e); }
  const lista = Object.values(dias).sort((a, b) => a.f < b.f ? -1 : 1);
  const ventas = lista.reduce((s, d) => s + d.ventas, 0), sal = lista.reduce((s, d) => s + d.sal, 0), bal = ventas - sal;
  const nombreE = e => e.proveedores?.nombre || e.empleados?.nombre || '';

  // filtros de salidas
  const provs = {}; egr.filter(e => e.tipo === 'proveedor').forEach(e => { const n = nombreE(e) || '—'; provs[n] = (provs[n] || 0) + +e.monto; });
  if (REP.prov && !provs[REP.prov]) REP.prov = '';
  const fil = egr.filter(e => (REP.tipo === 'todo' || e.tipo === REP.tipo) && (!REP.prov || (e.tipo === 'proveedor' && nombreE(e) === REP.prov)));
  const totFil = fil.reduce((s, e) => s + +e.monto, 0), vis = REP.todas ? fil : fil.slice(0, 8);

  const pagados = new Set(egr.filter(e => e.tipo === 'sueldo').map(e => e.empleado_id)), pend = emps.filter(e => !pagados.has(e.id));
  const etq = REP.per === 'dia' ? fdia(desde) : REP.per === 'mes' ? `${['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'][+desde.slice(5, 7) - 1]} ${desde.slice(0, 4)}` : `${fd(desde)} – ${fd(hasta)}`;
  const chip = (act, attrs, txt) => `<button class="${act ? 'pri' : ''}" ${attrs} style="min-height:40px;padding:6px 14px">${txt}</button>`;
  const sinDias = Math.max(0, Math.round((new Date(hasta) - new Date(desde)) / 864e5) + 1 - lista.length);

  $('#m').innerHTML = `<div class="row wrap" style="margin-bottom:10px;gap:6px">${[['dia', 'Hoy'], ['semana', 'Semana'], ['mes', 'Mes'], ['rango', 'Fechas']].map(([k, n]) => chip(REP.per === k, `data-per="${k}"`, n)).join('')}</div>
    ${REP.per === 'rango' ? `<div class="row" style="margin-bottom:10px"><input type="date" id="d1" value="${REP.d1}"><span class="mut">a</span><input type="date" id="d2" value="${REP.d2}"></div>`
      : `<div class="row" style="margin-bottom:10px"><button id="ant" style="min-height:42px">←</button><b class="grow" style="text-align:center;font-size:18px">${etq}</b><button id="sig" style="min-height:42px">→</button></div>`}
    <div class="stat" style="grid-template-columns:repeat(3,1fr)"><div class="card"><div class="mut">Entradas</div><div class="big" style="font-size:21px">${money(ventas)}</div></div>
      <div class="card"><div class="mut">Salidas</div><div class="big" style="font-size:21px">${money(sal)}</div></div>
      <div class="card"><div class="mut">Balance</div><div class="big ${bal < 0 ? 'neg' : 'ok'}" style="font-size:21px">${money(bal)}</div></div></div>
    ${propinas ? `<p class="mut" style="margin:-4px 2px 10px">Propinas del periodo (aparte, no cuentan): ${money(propinas)}</p>` : ''}
    ${ventas === 0 && hasta >= hoy() ? '<p class="mut" style="margin:-4px 2px 10px">Las ventas de cada día aparecen cuando se hace el corte Z.</p>' : ''}
    <div class="card"><b>Por día</b>${lista.map(d => `<div class="dia" data-f="${d.f}" style="padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer">
        <div class="row"><span class="grow">${fdia(d.f)}</span><span style="min-width:84px;text-align:right">${money(d.ventas)}</span><span style="min-width:84px;text-align:right" class="mut">${d.sal ? '-' + money(d.sal) : ''}</span><b style="min-width:84px;text-align:right" class="${d.ventas - d.sal < 0 ? 'neg' : ''}">${money(d.ventas - d.sal)}</b></div>
        <div class="det hide" style="margin-top:6px;padding-left:6px;font-size:15px">${[['Efectivo', d.efectivo], ['Tarjeta', d.tarjeta], ['Transferencia', d.transferencia], ['Otro', d.otro]].filter(x => x[1]).map(x => `<div class="row"><span class="grow mut">${x[0]}</span>${money(x[1])}</div>`).join('')}
          ${d.eg.map(e => `<div class="row"><span class="grow mut">− ${esc(e.concepto)}${nombreE(e) ? ' · ' + esc(nombreE(e)) : ''}</span>${money(e.monto)}</div>`).join('')}</div></div>`).join('') || '<p class="mut" style="margin:8px 0">Sin movimiento en este periodo.</p>'}
      ${lista.length ? `<div class="row mut" style="font-size:13px;padding-top:6px"><span class="grow">Toca un día para ver detalle${sinDias ? ` · ${sinDias} sin movimiento` : ''}</span><span style="min-width:84px;text-align:right">Ventas</span><span style="min-width:84px;text-align:right">Salidas</span><span style="min-width:84px;text-align:right">Balance</span></div>` : ''}</div>
    ${egr.length ? `<div class="card"><div class="row" style="margin-bottom:8px"><b class="grow">Salidas</b><b>${money(totFil)}</b></div>
      <div class="row wrap" style="gap:6px;margin-bottom:8px">${[['todo', 'Todas'], ['proveedor', 'Proveedores'], ['sueldo', 'Sueldos'], ['otro', 'Otros']].map(([k, n]) => chip(REP.tipo === k, `data-tipo="${k}"`, n)).join('')}</div>
      ${REP.tipo === 'proveedor' && Object.keys(provs).length > 1 ? `<select id="fprov" style="margin-bottom:8px"><option value="">Todos los proveedores</option>${Object.entries(provs).sort((a, b) => b[1] - a[1]).map(([n, m]) => `<option value="${esc(n)}" ${REP.prov === n ? 'selected' : ''}>${esc(n)} — ${money(m)}</option>`).join('')}</select>` : ''}
      ${vis.map(e => `<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><span class="grow"><span class="chip ${e.tipo}">${e.tipo}</span> ${esc(e.concepto)}<br><small class="mut">${fd(e.fecha)}${nombreE(e) ? ' · ' + esc(nombreE(e)) : ''} · ${e.forma_pago}</small></span><b>${money(e.monto)}</b><button data-x="${e.id}" style="min-height:36px;padding:2px 10px">✕</button></div>`).join('') || '<p class="mut" style="margin:6px 0">Nada con ese filtro.</p>'}
      ${fil.length > 8 ? `<button id="vt" style="width:100%;margin-top:8px;min-height:40px">${REP.todas ? 'Ver menos' : `Ver las ${fil.length}`}</button>` : ''}</div>` : ''}
    ${pend.length ? `<div class="card"><b>Sueldos por pagar esta semana</b>${pend.map(e => `<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><span class="grow">${esc(e.nombre)} <span class="mut">${esc(e.puesto)}</span></span><b>${money(e.sueldo_semanal)}</b><button data-pg="${e.id}" style="min-height:38px;padding:4px 12px">Pagar</button></div>`).join('')}</div>` : ''}`;

  const rec = () => run(semana);
  document.querySelectorAll('[data-per]').forEach(b => b.onclick = () => { REP.per = b.dataset.per; REP.ref = hoy(); REP.tipo = 'todo'; REP.prov = ''; REP.todas = false; rec(); });
  $('#ant') && ($('#ant').onclick = () => { moverRep(-1); rec(); }); $('#sig') && ($('#sig').onclick = () => { moverRep(1); rec(); });
  $('#d1') && ($('#d1').onchange = e => { REP.d1 = e.target.value || REP.d1; rec(); }); $('#d2') && ($('#d2').onchange = e => { REP.d2 = e.target.value || REP.d2; rec(); });
  document.querySelectorAll('[data-tipo]').forEach(b => b.onclick = () => { REP.tipo = b.dataset.tipo; REP.prov = ''; REP.todas = false; rec(); });
  $('#fprov') && ($('#fprov').onchange = e => { REP.prov = e.target.value; rec(); });
  $('#vt') && ($('#vt').onclick = () => { REP.todas = !REP.todas; rec(); });
  document.querySelectorAll('.dia').forEach(r => r.onclick = () => r.querySelector('.det').classList.toggle('hide'));
  document.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { const e = pend.find(x => x.id == b.dataset.pg); PRE = { tipo: 'sueldo', empleado_id: e.id, concepto: 'Sueldo semana ' + fd(desde), monto: e.sueldo_semanal }; TAB = 'salidas'; pintar(); });
  document.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { if (confirm('¿Cancelar esta salida?')) run(async () => { ok(await sb.from('egresos').update({ cancelado: true }).eq('id', b.dataset.x)); toast('Cancelada', 'ok'); semana(); }); });
}

// ---------- REPORTES (detalle) ----------
let RT = { tipo: 'entradas', prov: '', ts: 'todo' };
const MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const sumar = (a, k) => a.reduce((s, x) => s + (+x[k] || 0), 0);
const diasEntre = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 864e5) + 1;
function prevRango(d, h) { const n = diasEntre(d, h), x = new Date(d + 'T00:00'); const h2 = new Date(x); h2.setDate(x.getDate() - 1); const d2 = new Date(x); d2.setDate(x.getDate() - n); return [ymd(d2), ymd(h2)]; }
function vsHTML(a, b, masEsMalo) { if (!b) return ''; const v = (a - b) / b * 100, bueno = masEsMalo ? v <= 0 : v >= 0; return `<span class="${bueno ? 'ok' : 'neg'}" style="font-size:14px">${v >= 0 ? '▲' : '▼'} ${Math.abs(v).toFixed(0)}% vs periodo anterior (${money(b)})</span>`; }
const filaT = (a, b, neg) => `<div class="row" style="padding:7px 0;border-top:1px solid var(--line)"><span class="grow">${a}</span><b class="${neg ? 'neg' : ''}">${b}</b></div>`;
const pc = (x, t) => t ? ` <span class="mut">${(x / t * 100).toFixed(0)}%</span>` : '';
function descargar(nombre, filas) {
  const csv = filas.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' })); a.download = nombre; a.click();
}
function hdrPeriodo(desde, hasta) {
  const etq = REP.per === 'dia' ? fdia(desde) : REP.per === 'mes' ? `${MESES_L[+desde.slice(5, 7) - 1]} ${desde.slice(0, 4)}` : `${fd(desde)} – ${fd(hasta)}`;
  const chip = (act, attrs, txt) => `<button class="${act ? 'pri' : ''}" ${attrs} style="min-height:40px;padding:6px 14px">${txt}</button>`;
  return `<div class="row wrap" style="margin-bottom:10px;gap:6px">${[['dia', 'Hoy'], ['semana', 'Semana'], ['mes', 'Mes'], ['rango', 'Fechas']].map(([k, n]) => chip(REP.per === k, `data-per="${k}"`, n)).join('')}</div>` +
    (REP.per === 'rango' ? `<div class="row" style="margin-bottom:10px"><input type="date" id="d1" value="${REP.d1}"><span class="mut">a</span><input type="date" id="d2" value="${REP.d2}"></div>`
      : `<div class="row" style="margin-bottom:10px"><button id="ant" style="min-height:42px">←</button><b class="grow" style="text-align:center;font-size:18px">${etq}</b><button id="sig" style="min-height:42px">→</button></div>`);
}
function bindPeriodo(rec) {
  document.querySelectorAll('[data-per]').forEach(b => b.onclick = () => { REP.per = b.dataset.per; REP.ref = hoy(); rec(); });
  $('#ant') && ($('#ant').onclick = () => { moverRep(-1); rec(); }); $('#sig') && ($('#sig').onclick = () => { moverRep(1); rec(); });
  $('#d1') && ($('#d1').onchange = e => { REP.d1 = e.target.value || REP.d1; rec(); }); $('#d2') && ($('#d2').onchange = e => { REP.d2 = e.target.value || REP.d2; rec(); });
}

async function reportes() {
  const [desde, hasta] = rangoRep();
  if (desde > hasta) throw new Error('La fecha inicial es mayor que la final');
  const [pd, ph] = prevRango(desde, hasta), nDias = diasEntre(desde, hasta);
  const entr = RT.tipo === 'entradas';
  const [cur, prev] = await Promise.all([
    entr ? sb.from('cortes').select('*').gte('fecha', desde).lte('fecha', hasta).order('fecha').then(ok)
      : sb.from('egresos').select('*,proveedores(nombre),empleados(nombre)').gte('fecha', desde).lte('fecha', hasta).eq('cancelado', false).order('fecha').order('id').then(ok),
    entr ? sb.from('cortes').select('ventas_netas').gte('fecha', pd).lte('fecha', ph).then(ok)
      : sb.from('egresos').select('monto,tipo').gte('fecha', pd).lte('fecha', ph).eq('cancelado', false).then(ok)]);
  const emps = RT.tipo === 'sueldos' ? await sb.from('empleados').select('*').eq('activo', true).order('nombre').then(ok) : [];
  const tabs = [['entradas', 'Entradas'], ['salidas', 'Salidas'], ['proveedores', 'Proveedores'], ['sueldos', 'Sueldos']];
  let cuerpo = '', csv = null;
  const nom = e => e.proveedores?.nombre || e.empleados?.nombre || '';

  if (entr) {
    const ventas = sumar(cur, 'ventas_netas'), brutas = sumar(cur, 'ventas_brutas'), desc = sumar(cur, 'descuentos'), cuentas = sumar(cur, 'cuentas'), pers = sumar(cur, 'personas'), prop = sumar(cur, 'propinas');
    const forma = [['Efectivo', sumar(cur, 'efectivo')], ['Tarjeta', sumar(cur, 'tarjeta')], ['Transferencia', sumar(cur, 'transferencia')], ['Otro', sumar(cur, 'otro')]].filter(x => x[1]);
    const mejor = cur.slice().sort((a, b) => b.ventas_netas - a.ventas_netas)[0], dif = sumar(cur, 'diferencia');
    const cat = {}, mes = {};
    for (const c of cur) { (c.detalle?.porCategoria || []).forEach(x => { cat[x.nombre] = (cat[x.nombre] || 0) + +x.venta; }); (c.detalle?.porMesero || []).forEach(x => { const m = mes[x.nombre] || (mes[x.nombre] = { v: 0, c: 0 }); m.v += +x.venta; m.c += +x.cuentas; }); }
    cuerpo = `<div class="card"><div class="mut">Ventas netas</div><div class="big">${money(ventas)}</div>${vsHTML(ventas, sumar(prev, 'ventas_netas'))}
      ${filaT('Cuentas cobradas', cuentas)}${filaT('Ticket promedio', money(cuentas ? ventas / cuentas : 0))}${filaT('Personas atendidas', pers + (pers ? ' · ' + money(ventas / pers) + ' c/u' : ''))}
      ${filaT('Promedio por día con corte', money(cur.length ? ventas / cur.length : 0))}${mejor ? filaT('Mejor día', `${fdia(mejor.fecha)} · ${money(mejor.ventas_netas)}`) : ''}
      ${filaT('Venta bruta', money(brutas))}${desc ? filaT('Descuentos', '-' + money(desc)) : ''}${filaT('Propinas (aparte)', money(prop))}${dif ? filaT('Diferencia de caja acumulada', money(dif), dif < 0) : ''}</div>
      ${forma.length ? `<div class="card"><b>Cómo pagaron</b>${forma.map(x => filaT(x[0] + pc(x[1], ventas), money(x[1]))).join('')}</div>` : ''}
      ${Object.keys(cat).length ? `<div class="card"><b>Por categoría</b>${Object.entries(cat).sort((a, b) => b[1] - a[1]).map(([n, v]) => filaT(esc(n) + pc(v, brutas), money(v))).join('')}</div>` : ''}
      ${Object.keys(mes).length ? `<div class="card"><b>Por mesero</b>${Object.entries(mes).sort((a, b) => b[1].v - a[1].v).map(([n, m]) => filaT(`${esc(n)} <span class="mut">${m.c} cuentas</span>`, money(m.v))).join('')}</div>` : ''}
      <div class="card"><b>Por día</b>${cur.map(c => filaT(`${fdia(c.fecha)} <span class="mut">${c.cuentas} cuentas</span>`, money(c.ventas_netas))).join('') || '<p class="mut">Sin cortes en este periodo.</p>'}</div>`;
    csv = [['Fecha', 'Cuentas', 'Personas', 'Ventas netas', 'Descuentos', 'Efectivo', 'Tarjeta', 'Transferencia', 'Otro', 'Propinas', 'Diferencia caja'], ...cur.map(c => [c.fecha, c.cuentas, c.personas, c.ventas_netas, c.descuentos, c.efectivo, c.tarjeta, c.transferencia, c.otro, c.propinas, c.diferencia])];
  }

  if (RT.tipo === 'salidas') {
    const tot = sumar(cur, 'monto'), tipos = ['proveedor', 'sueldo', 'otro'].map(t => [t, sumar(cur.filter(e => e.tipo === t), 'monto')]).filter(x => x[1]);
    const formas = {}; cur.forEach(e => { formas[e.forma_pago] = (formas[e.forma_pago] || 0) + +e.monto; });
    const dias = new Set(cur.map(e => e.fecha)).size, lista = cur.filter(e => RT.ts === 'todo' || e.tipo === RT.ts).slice().reverse();
    cuerpo = `<div class="card"><div class="mut">Total de salidas</div><div class="big">${money(tot)}</div>${vsHTML(tot, sumar(prev, 'monto'), true)}
      ${filaT('Movimientos', cur.length)}${filaT('Promedio por día con salidas', money(dias ? tot / dias : 0))}${filaT('Promedio por día del periodo', money(tot / nDias))}</div>
      ${tipos.length ? `<div class="card"><b>Por tipo</b>${tipos.map(([t, m]) => filaT(({ proveedor: 'Proveedores', sueldo: 'Sueldos', otro: 'Otros gastos' })[t] + pc(m, tot), money(m))).join('')}</div>` : ''}
      ${Object.keys(formas).length ? `<div class="card"><b>Forma de pago</b>${Object.entries(formas).map(([f, m]) => filaT(f + pc(m, tot), money(m))).join('')}</div>` : ''}
      <div class="card"><b>Detalle</b><div class="row wrap" style="gap:6px;margin:8px 0">${[['todo', 'Todas'], ['proveedor', 'Proveedores'], ['sueldo', 'Sueldos'], ['otro', 'Otros']].map(([k, n]) => `<button class="${RT.ts === k ? 'pri' : ''}" data-ts="${k}" style="min-height:38px;padding:4px 12px">${n}</button>`).join('')}</div>
      ${lista.map(e => `<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><span class="grow"><span class="chip ${e.tipo}">${e.tipo}</span> ${esc(e.concepto)}<br><small class="mut">${fd(e.fecha)}${nom(e) ? ' · ' + esc(nom(e)) : ''} · ${e.forma_pago}${e.nota ? ' · ' + esc(e.nota) : ''}</small></span><b>${money(e.monto)}</b></div>`).join('') || '<p class="mut">Nada con ese filtro.</p>'}</div>`;
    csv = [['Fecha', 'Tipo', 'Concepto', 'Proveedor/Empleado', 'Forma de pago', 'Monto', 'Nota'], ...cur.map(e => [e.fecha, e.tipo, e.concepto, nom(e), e.forma_pago, e.monto, e.nota])];
  }

  if (RT.tipo === 'proveedores') {
    const pv = cur.filter(e => e.tipo === 'proveedor'), tot = sumar(pv, 'monto'), g = {};
    pv.forEach(e => { const n = nom(e) || '—', x = g[n] || (g[n] = { m: 0, n: 0, u: '' }); x.m += +e.monto; x.n++; if (e.fecha > x.u) x.u = e.fecha; });
    const nombres = Object.keys(g).sort((a, b) => g[b].m - g[a].m); if (RT.prov && !g[RT.prov]) RT.prov = '';
    const sel = RT.prov ? pv.filter(e => nom(e) === RT.prov).slice().reverse() : [];
    cuerpo = `<div class="card"><div class="mut">Pagado a proveedores</div><div class="big">${money(tot)}</div>${vsHTML(tot, sumar(prev.filter(e => e.tipo === 'proveedor'), 'monto'), true)}${filaT('Proveedores pagados', nombres.length)}${filaT('Pagos', pv.length)}</div>
      <div class="card"><b>Por proveedor</b> <span class="mut" style="font-size:14px">· toca uno para ver sus pagos</span>${nombres.map(n => `<div class="row prv" data-p="${esc(n)}" style="padding:9px 0;border-top:1px solid var(--line);cursor:pointer;${RT.prov === n ? 'background:#fff7d6' : ''}"><span class="grow">${esc(n)}${pc(g[n].m, tot)}<br><small class="mut">${g[n].n} pago${g[n].n > 1 ? 's' : ''} · último ${fd(g[n].u)}</small></span><b>${money(g[n].m)}</b></div>`).join('') || '<p class="mut">Sin pagos a proveedores en este periodo.</p>'}</div>
      ${sel.length ? `<div class="card"><b>${esc(RT.prov)}</b>${sel.map(e => filaT(`${fd(e.fecha)} · ${esc(e.concepto)} <span class="mut">${e.forma_pago}</span>`, money(e.monto))).join('')}</div>` : ''}`;
    csv = [['Proveedor', 'Pagos', 'Total', 'Último pago'], ...nombres.map(n => [n, g[n].n, g[n].m, g[n].u])];
  }

  if (RT.tipo === 'sueldos') {
    const sd = cur.filter(e => e.tipo === 'sueldo'), tot = sumar(sd, 'monto'), semanas = Math.max(1, Math.ceil(nDias / 7));
    const pag = {}; sd.forEach(e => { const x = pag[e.empleado_id] || (pag[e.empleado_id] = { m: 0, n: 0 }); x.m += +e.monto; x.n++; });
    const conSueldo = emps.filter(e => +e.sueldo_semanal > 0), esperado = conSueldo.reduce((s, e) => s + e.sueldo_semanal * semanas, 0);
    cuerpo = `<div class="card"><div class="mut">Sueldos pagados</div><div class="big">${money(tot)}</div>${vsHTML(tot, sumar(prev.filter(e => e.tipo === 'sueldo'), 'monto'), true)}
      ${conSueldo.length ? filaT(`Nómina esperada (${semanas} sem.)`, money(esperado)) + filaT('Falta por pagar', money(Math.max(0, esperado - tot)), esperado - tot > 0) : ''}</div>
      <div class="card"><b>Por empleado</b>${emps.map(e => { const p = pag[e.id] || { m: 0, n: 0 }, deb = e.sueldo_semanal * semanas - p.m; return `<div class="row" style="padding:9px 0;border-top:1px solid var(--line)"><span class="grow">${esc(e.nombre)} <span class="mut">${esc(e.puesto)}</span><br><small class="mut">${+e.sueldo_semanal ? `sueldo ${money(e.sueldo_semanal)}/sem · ` : ''}${p.n} pago${p.n === 1 ? '' : 's'}${+e.sueldo_semanal && deb > 0.009 ? ` · <span class="neg">falta ${money(deb)}</span>` : ''}</small></span><b>${money(p.m)}</b></div>`; }).join('') || '<p class="mut">Da de alta al personal en la pestaña Personal.</p>'}</div>
      ${sd.length ? `<div class="card"><b>Pagos del periodo</b>${sd.slice().reverse().map(e => filaT(`${fd(e.fecha)} · ${esc(nom(e))} <span class="mut">${esc(e.concepto)}</span>`, money(e.monto))).join('')}</div>` : ''}`;
    csv = [['Fecha', 'Empleado', 'Concepto', 'Forma de pago', 'Monto'], ...sd.map(e => [e.fecha, nom(e), e.concepto, e.forma_pago, e.monto])];
  }

  $('#m').innerHTML = `<div class="row wrap" style="gap:6px;margin-bottom:10px">${tabs.map(([k, n]) => `<button class="${RT.tipo === k ? 'pri' : ''}" data-rt="${k}" style="min-height:42px;padding:6px 14px">${n}</button>`).join('')}</div>${hdrPeriodo(desde, hasta)}${cuerpo}
    <button id="csv" style="width:100%;margin-top:4px">⬇ Descargar en Excel (CSV)</button>`;
  const rec = () => run(reportes);
  document.querySelectorAll('[data-rt]').forEach(b => b.onclick = () => { RT.tipo = b.dataset.rt; RT.prov = ''; RT.ts = 'todo'; rec(); });
  document.querySelectorAll('[data-ts]').forEach(b => b.onclick = () => { RT.ts = b.dataset.ts; rec(); });
  document.querySelectorAll('.prv').forEach(r => r.onclick = () => { RT.prov = RT.prov === r.dataset.p ? '' : r.dataset.p; rec(); });
  $('#csv').onclick = () => descargar(`mariscos-${RT.tipo}-${desde}_${hasta}.csv`, csv);
  bindPeriodo(rec);
}

// ---------- SALIDAS (captura) ----------
async function salidas() {
  const admin = PERFIL.rol === 'admin';
  const [provs, emps] = await Promise.all([sb.from('proveedores').select('id,nombre').eq('activo', true).order('nombre').then(ok), admin ? sb.from('empleados').select('id,nombre,sueldo_semanal').eq('activo', true).order('nombre').then(ok) : []]);
  const p = PRE || {}; PRE = null;
  const ult = await sb.from('egresos').select('*,proveedores(nombre),empleados(nombre)').eq('cancelado', false).order('id', { ascending: false }).limit(15).then(ok);
  $('#m').innerHTML = `<div class="card"><b style="font-size:20px">Registrar salida</b>
    <label>Tipo</label><select id="tp"><option value="proveedor">Pago a proveedor</option>${admin ? '<option value="sueldo">Sueldo</option>' : ''}<option value="otro">Otro gasto</option></select>
    <div id="bp"><label>Proveedor</label><select id="pv"><option value="">— elige —</option>${provs.map(x => `<option value="${x.id}">${esc(x.nombre)}</option>`).join('')}</select></div>
    <div id="be" class="hide"><label>Empleado</label><select id="em"><option value="">— elige —</option>${emps.map(x => `<option value="${x.id}" data-s="${x.sueldo_semanal}">${esc(x.nombre)}</option>`).join('')}</select></div>
    <label>Concepto</label><input id="cn" maxlength="100" placeholder="Ej. camarón 20 kg, renta, gas…">
    <label>Monto</label><input id="mt" type="number" inputmode="decimal" step="0.01" min="0">
    <label>Forma de pago</label><select id="fp"><option value="efectivo">Efectivo</option><option value="transferencia">Transferencia</option><option value="tarjeta">Tarjeta</option><option value="otro">Otro</option></select>
    ${admin ? `<label>Fecha</label><input id="fe" type="date" value="${hoy()}">` : ''}
    <label>Nota (opcional)</label><input id="nt" maxlength="200">
    <button class="pri" style="width:100%;margin-top:14px" id="gd">Guardar salida</button></div>
    <div class="card"><b>Últimas salidas</b>${ult.map(e => `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="grow"><span class="chip ${e.tipo}">${e.tipo}</span> ${esc(e.concepto)}<br><small class="mut">${e.fecha.slice(8)}/${e.fecha.slice(5, 7)} · ${esc(e.proveedores?.nombre || e.empleados?.nombre || '')}</small></span><b>${money(e.monto)}</b></div>`).join('') || '<p class="mut">Aún no hay salidas.</p>'}</div>`;
  const ver = () => { const t = $('#tp').value; $('#bp').classList.toggle('hide', t !== 'proveedor'); $('#be').classList.toggle('hide', t !== 'sueldo'); };
  $('#tp').onchange = ver;
  $('#em').onchange = () => { const o = $('#em').selectedOptions[0]; if (o && o.dataset.s) { $('#mt').value = o.dataset.s; if (!$('#cn').value) $('#cn').value = 'Sueldo semanal'; } };
  if (p.tipo) { $('#tp').value = p.tipo; ver(); if (p.empleado_id) $('#em').value = p.empleado_id; $('#cn').value = p.concepto || ''; $('#mt').value = p.monto || ''; }
  $('#gd').onclick = () => run(async () => {
    const t = $('#tp').value, fila = { tipo: t, concepto: $('#cn').value.trim(), monto: +$('#mt').value, forma_pago: $('#fp').value, nota: $('#nt').value.trim(), fecha: admin ? $('#fe').value : hoy() };
    if (!fila.concepto) throw new Error('Falta el concepto'); if (!(fila.monto > 0)) throw new Error('El monto debe ser mayor a cero');
    if (t === 'proveedor') { if (!$('#pv').value) throw new Error('Elige un proveedor'); fila.proveedor_id = +$('#pv').value; }
    if (t === 'sueldo') { if (!$('#em').value) throw new Error('Elige al empleado'); fila.empleado_id = +$('#em').value; }
    ok(await sb.from('egresos').insert(fila)); toast('Salida guardada ✔', 'ok'); salidas();
  });
}

// ---------- catálogos ----------
async function catalogo(tabla, titulo, campos, cols) {
  const filas = await sb.from(tabla).select('*').order('nombre').then(ok);
  $('#m').innerHTML = `<div class="row" style="margin-bottom:10px"><b class="grow" style="font-size:20px">${titulo}</b><button class="pri" id="nv">+ Agregar</button></div>
    <div class="card scroll"><table><tr>${cols.map(c => `<th>${c[1]}</th>`).join('')}<th></th></tr>${filas.map(f => `<tr style="${f.activo ? '' : 'opacity:.45'}">${cols.map(c => `<td>${c[2] ? c[2](f[c[0]]) : esc(f[c[0]])}</td>`).join('')}<td class="r"><button data-e="${f.id}" style="min-height:38px;padding:4px 12px">Editar</button></td></tr>`).join('') || '<tr><td class="mut">Vacío</td></tr>'}</table></div>`;
  const form = f => {
    f = f || { activo: true };
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div><h3 style="margin-top:0">${f.id ? 'Editar' : 'Agregar'}</h3>${campos.map(c => `<label>${c[1]}</label><input data-k="${c[0]}" ${c[2] === 'num' ? 'type="number" inputmode="decimal" step="0.01"' : ''} value="${esc(f[c[0]] ?? '')}">`).join('')}<label>Activo</label><select data-k="activo"><option value="true" ${f.activo ? 'selected' : ''}>Sí</option><option value="false" ${f.activo ? '' : 'selected'}>No</option></select>
      <div class="row" style="margin-top:14px"><button class="grow" data-c>Cancelar</button><button class="pri grow" data-s>Guardar</button></div></div>`;
    document.body.appendChild(m); $('[data-c]', m).onclick = () => m.remove();
    $('[data-s]', m).onclick = () => run(async () => {
      const o = {}; m.querySelectorAll('[data-k]').forEach(e => { let v = e.value; if (e.dataset.k === 'activo') v = v === 'true'; else if (e.type === 'number') v = +v || 0; o[e.dataset.k] = v; });
      if (!String(o.nombre || '').trim()) throw new Error('Falta el nombre');
      ok(f.id ? await sb.from(tabla).update(o).eq('id', f.id) : await sb.from(tabla).insert(o)); m.remove(); toast('Guardado', 'ok'); catalogo(tabla, titulo, campos, cols);
    });
  };
  $('#nv').onclick = () => form(); document.querySelectorAll('[data-e]').forEach(b => b.onclick = () => form(filas.find(x => x.id == b.dataset.e)));
}
const proveedores = () => catalogo('proveedores', 'Proveedores', [['nombre', 'Nombre'], ['telefono', 'Teléfono'], ['nota', 'Nota']], [['nombre', 'Nombre'], ['telefono', 'Teléfono'], ['nota', 'Nota']]);
const personal = () => catalogo('empleados', 'Personal y sueldos', [['nombre', 'Nombre'], ['puesto', 'Puesto'], ['sueldo_semanal', 'Sueldo semanal', 'num']], [['nombre', 'Nombre'], ['puesto', 'Puesto'], ['sueldo_semanal', 'Sueldo semanal', money]]);

if (SUPABASE_ANON_KEY.startsWith('PEGAR')) app.innerHTML = '<div class="login"><div class="card"><b>Falta configurar</b><p>Pega la llave anon/public de Supabase en <code>index.html</code> (constante SUPABASE_ANON_KEY).</p></div></div>';
else iniciar();
</script></body></html>
